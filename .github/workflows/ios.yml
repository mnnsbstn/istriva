name: Build native ISTRIVA iOS app

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test native core
        working-directory: ios/ISTRIVACore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS Simulator app
        working-directory: ios
        run: |
          xcodebuild \
            -project ISTRIVA.xcodeproj \
            -scheme ISTRIVA \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ISTRIVA-xcodeproj
          path: ios/ISTRIVA.xcodeproj
          retention-days: 7
